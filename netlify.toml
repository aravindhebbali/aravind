# Netlify build + redirect policy.
#
# Publish root is the Quarto output. `_site/` is committed to the repo because
# the locked pipeline is "local `quarto render`, Netlify serves static" - the
# Netlify build image has no Quarto and no CI is configured, so nothing else
# would populate `_site/`.
#
# DANGER: `publish = "_site"` makes this directory the site root. Removing the
# key returns the repo root to being served. Everything below the legacy 301s
# must stay in place permanently - the .html and /libraries.html URLs are linked
# from CRAN vignettes, GitHub READMEs, package docs and academic citations.
[build]
  publish = "_site"

# --- Legacy inbound URLs -> current extensionless targets -------------------

[[redirects]]
  from = "/libraries.html"
  to = "/packages/"
  status = 301
  force = true

[[redirects]]
  from = "/apps.html"
  to = "/apps/"
  status = 301
  force = true

[[redirects]]
  from = "/e-books.html"
  to = "/books/"
  status = 301
  force = true

[[redirects]]
  from = "/r-packages.html"
  to = "/packages/"
  status = 301
  force = true

[[redirects]]
  from = "/r-shiny-apps.html"
  to = "/apps/"
  status = 301
  force = true

# --- Former extensionless duplicates ---------------------------------------
# These were 200s byte-identical to the .html pages and competed with them for
# indexing. Fold them into the new canonical targets.

[[redirects]]
  from = "/r-packages"
  to = "/packages/"
  status = 301
  force = true

[[redirects]]
  from = "/r-shiny-apps"
  to = "/apps/"
  status = 301
  force = true

[[redirects]]
  from = "/e-books"
  to = "/books/"
  status = 301
  force = true

# --- Trailing-slash variants ----------------------------------------------
# Previously these bounced through Netlify's pretty-URL handling into a 2-3 hop
# chain before landing anywhere. Normalise them in one hop.

[[redirects]]
  from = "/r-packages.html/"
  to = "/packages/"
  status = 301
  force = true

[[redirects]]
  from = "/r-shiny-apps.html/"
  to = "/apps/"
  status = 301
  force = true

[[redirects]]
  from = "/e-books.html/"
  to = "/books/"
  status = 301
  force = true