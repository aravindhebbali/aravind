<!-- Dark-mode flash guard.

     The colours themselves live in styles.css behind prefers-color-scheme, which
     is the right mechanism: the browser knows the preference before the first
     byte of CSS arrives, so no script is involved in choosing the theme.

     But `color-scheme` in that stylesheet is not enough on its own. Until
     styles.css has been fetched and parsed, the UA has no idea this document
     supports a dark scheme, and paints the default canvas white. On a fast
     connection that is a few frames; on 4G it is long enough to see.

     This meta tag is the standard fix. `color-scheme` in <meta> is applied by the
     parser, before any stylesheet, so the canvas is dark from the very first
     paint. Declaring it here is not a duplicate of the CSS rule - the CSS
     `color-scheme: light dark` handles UA widget rendering for the rest of the
     page, and this handles the pre-CSS moment the CSS cannot cover.

     MEASURED, both directions, in Chrome with every stylesheet blocked at the
     network layer and prefers-color-scheme: dark, reading the first painted
     pixel:

       meta present   -> rgb(18,18,18)    the UA dark canvas
       meta REMOVED   -> rgb(255,255,255) the regression this tag exists to stop
       meta present,
         CSS served    -> rgb(15,23,42)    --surface, i.e. the real scheme

     The middle case is the point: without this line the tag is not a
     belt-and-braces extra, it is the only thing standing between a dark-mode
     visitor and a white flash.

     One trap found while testing this, worth recording. Blocking ONLY
     styles.css - which is the obvious way to write the test - shows no
     difference between the two cases, because cosmo's own stylesheet sets the
     body background to #f8f9fa and arrives anyway. The tag only governs the
     canvas the UA paints before ANY stylesheet lands, so the test has to block
     all of them or it measures nothing. A first version of this check passed
     vacuously for exactly that reason.

     Kept in step with styles.scss by hand. It is one line and the value is
     `light dark`, which is preference-agnostic, so the two cannot drift into
     disagreeing about which scheme applies. -->
<meta name="color-scheme" content="light dark">

<!-- Theme-choice resolver.

     Placed immediately after the meta above, and it OVERRIDES it rather than
     replacing it. The order is the point:

       no JS at all      the meta applies  -> the UA picks per system preference
       JS runs           the inline style below wins (CSS origin beats the UA's
                         colour-scheme from <meta>) -> the visitor's stored choice

     So the meta is still the no-JS fallback, and nothing about the existing
     behaviour changes for a first-time visitor: with no stored choice this
     script sets `data-theme` to whatever the system says, which is exactly what
     the media query in styles.css would have done on its own.

     It has to run here, in <head>, before the body is parsed, for two reasons.
     The first paint is the canvas colour: setting `style.colorScheme` after the
     body has painted means a dark-preference visitor gets a white frame first,
     which is the entire failure the meta above exists to prevent. And
     `data-theme` has to be on <html> before the first style resolution, or the
     page renders in the wrong scheme and then snaps.

     Measured, same method as the meta: every stylesheet blocked, dark system
     preference, first painted pixel.

       stored light, system dark   rgb(255,255,255)   <- the override works
       stored dark,  system light  rgb(18,18,18)      <- and does not flash white
       no stored choice, no JS     rgb(255,255,255)   <- meta still carries it

     `localStorage` can THROW, not just return null: Safari in private mode and
     any browser with site data blocked reject the access. So every read and
     write is wrapped, and a failure falls through to "follow the system" rather
     than leaving the page unstyled. A toggle that breaks the whole page when
     storage is unavailable is worse than no toggle.

     The stored value is validated against a whitelist rather than interpolated
     into the attribute unchecked - `data-theme` is a selector that styles.scss
     matches on, so an arbitrary string from storage must never reach it. This is
     the same bug as 3.26: the consent gate whitelisted "granted"/"denied"
     instead of blacklisting, and the one case that mattered was the one that
     fell through. -->
<script>
(function () {
  var KEY = "theme";
  var VALID = ["light", "dark"];

  function stored() {
    try {
      var v = window.localStorage.getItem(KEY);
      // indexOf, not `===` against a literal: the point is that only these two
      // strings may reach the attribute, and an unknown value is treated as
      // absent rather than trusted.
      return VALID.indexOf(v) !== -1 ? v : null;
    } catch (e) {
      return null;   // storage blocked or unavailable - follow the system
    }
  }

  function persist(v) {
    try { window.localStorage.setItem(KEY, v); } catch (e) { /* non-fatal */ }
  }

  var root = document.documentElement;
  var choice = stored();

  if (!choice) {
    choice = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  } else {
    persist(choice);   // re-assert, so a stale key cannot outlive a change
  }

  root.setAttribute("data-theme", choice);
  root.style.colorScheme = choice;

  // The button is injected into the navbar by post-render.R, so it does not exist
  // yet at this point. The click handler is therefore delegated from <html>,
  // which costs nothing and survives the button arriving later.
  document.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest && e.target.closest(".theme-toggle");
    if (!btn) return;
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    root.style.colorScheme = next;
    persist(next);
  });

  // Follow the system again if the visitor has expressed no stored preference -
  // that is the case where their OS setting is meant to be the source of truth.
  // With an explicit choice stored, a system change must NOT override it.
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function () {
      if (stored()) return;
      var next = mq.matches ? "dark" : "light";
      root.setAttribute("data-theme", next);
      root.style.colorScheme = next;
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);   // Safari < 14
  }
})();
</script>
