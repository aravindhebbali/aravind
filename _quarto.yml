project:
  type: website
  output-dir: _site
  # Explicit list: the roadmap/ planning docs are markdown and would
  # otherwise be rendered and published alongside the site.
  render:
    - index.qmd
    - packages/index.qmd
    - apps/index.qmd
    - books/index.qmd
    - 404.qmd
  post-render: post-render.R
  resources:
    - "_headers"
    - "favicon.ico"
    - "zohoverify/**"
    # WebP renditions generated by optimize-images.R. The full-size PNG
    # originals stay in the repo as regeneration sources but are deliberately
    # NOT published - they total 4.07 MB and nothing renders above 440px.
    - "images/avatar.webp"
    - "images/avatar-sm.webp"
    - "images/og-card.jpg"
    - "images/hex-olsrr.webp"
    - "images/hex-blorr.webp"
    - "images/hex-xplorerr.webp"
    - "images/hex-descriptr.webp"
    - "images/hex-inferr.webp"
    - "images/hex-vistributions.webp"
    - "images/hex-rbin.webp"
    - "images/hex-rfm.webp"
    - "images/book-intro-r.webp"
    - "images/book-wrangle-r.webp"
    - "images/book-viz-ggplot2.webp"
    - "images/book-viz-base.webp"
    - "images/book-rdbsql.webp"
    - "images/book-bash-intro.webp"

website:
  title: "Aravind Hebbali"
  site-url: "https://www.aravindhebbali.com/"
  favicon: favicon.ico
  search: true
  reader-mode: false
  open-graph: true
  twitter-card: true
  navbar:
    background: "#0f172a"
    foreground: "#e2e8f0"
    logo: images/avatar-sm.webp
    logo-alt: "Aravind Hebbali"
    search: true
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: packages/index.qmd
        text: Packages
      - href: apps/index.qmd
        text: Apps
      - href: books/index.qmd
        text: Books
    right:
      - text: Teaching
        href: https://www.rsquaredacademy.com/
        target: _blank
      - icon: github
        href: https://github.com/aravindhebbali
        aria-label: GitHub
        target: _blank
      - text: Blog
        href: https://blog.rsquaredacademy.com
        target: _blank

format:
  html:
    theme:
      - cosmo
    css: styles.scss
    toc: false
    anchor-sections: true
    smooth-scroll: true
    canonical-url: true
    link-external-icon: true
    link-external-newwindow: true
    other-links:
      - icon: envelope
        href: "mailto:hebbali.aravind@gmail.com"
        text: "Email"
    page-footer:
      left: "&copy; Aravind Hebbali"
      right:
        - text: "hebbali.aravind@gmail.com"
          icon: envelope
          href: "mailto:hebbali.aravind@gmail.com"
          target: _blank
        - icon: github
          href: https://github.com/aravindhebbali
          aria-label: GitHub
          target: _blank
        - icon: linkedin
          href: https://www.linkedin.com/in/aravind-hebbali-b6553831/
          aria-label: LinkedIn
          target: _blank
        - text: "Sitemap"
          icon: list
          href: sitemap.xml
    include-in-header:
      - head-includes.html

# Deliberately NOT frozen. The CRAN download total is time-varying, and
# `freeze: auto` / `freeze: true` would reuse the cached value forever, so the
# monthly Actions re-render could never pick up new numbers. Re-querying costs
# one CRAN API call per render and the chunk falls back to a static string if
# the API is unreachable - it never fabricates a value.
execute:
  warning: false
  message: false