project:
  type: website
  output-dir: _site
  # Explicit list: the roadmap/ planning docs are markdown and would
  # otherwise be rendered and published alongside the site.
  render:
    - index.qmd
    - packages/index.qmd
    - apps/index.qmd
    - books/index.qmd
    - privacy/index.qmd
    - 404.qmd
  post-render: post-render.R
  resources:
    - "_headers"
    - "favicon.ico"
    - "zohoverify/**"
    # WebP renditions generated by optimize-images.R. The full-size PNG
    # originals stay in the repo as regeneration sources but are deliberately
    # NOT published - they total 4.07 MB and nothing renders above 440px.
    - "images/avatar.webp"
    - "images/avatar-sm.webp"
    - "images/og-card.jpg"
    # Self-hosted Source Sans Pro (400 + 600, latin subset). Replaces the
    # Google Fonts @import in cosmo, which reached Google before the consent
    # banner was answered. See the Icons/fonts section of styles.scss.
    - "images/fonts/**"
    - "images/hex-olsrr.webp"
    - "images/hex-blorr.webp"
    - "images/hex-xplorerr.webp"
    - "images/hex-descriptr.webp"
    - "images/hex-inferr.webp"
    - "images/hex-vistributions.webp"
    - "images/hex-rbin.webp"
    - "images/hex-rfm.webp"
    # Book covers are standalone SVGs extracted from ebooks.rsquaredacademy.com,
    # where they exist only as inline markup. They supersede the raster covers,
    # so the book-*.webp renditions and their PNG sources are gone.
    - "images/covers/**"

website:
  title: "Aravind Hebbali"
  site-url: "https://www.aravindhebbali.com/"
  favicon: favicon.ico
  search: true
  reader-mode: false
  open-graph: true
  twitter-card: true
  navbar:
    # No background/foreground keys, and the reason is not cosmetic.
    #
    # These set Bootstrap's --bs-navbar-color, which is what the navbar
    # INHERITS from - and docsearch's search button draws its icon with
    # `fill="currentColor"`. So `foreground: "#e2e8f0"` painted the search
    # icon #e2e8f0 on a navbar that styles.scss paints white: **1.23:1**, far
    # under the 3:1 WCAG minimum for a non-text graphic. The icon was there and
    # was genuinely invisible. Removing the key drops it to #545555 = 7.48:1.
    #
    # So this is a real fix, not a cleanup, and it is the only reason to touch
    # this block. Note what it does NOT do: `background` was never inert in
    # effect either, but styles.scss overrides `.navbar` background on
    # specificity, so that one only ever lied - see the .navbar rules there.
    #
    # For the record, my first hypothesis was wrong and the comment above it
    # said so: I assumed these keys caused data-bs-theme="dark" on the <nav>.
    # They do not. That attribute is Quarto's DEFAULT for any navbar with items
    # - proven by rendering a scratch project whose navbar had only a `left:`
    # list, no theme keys at all, which still emitted it. styles.scss
    # neutralises the dark Bootstrap tokens it pulls in either way.
    logo: images/avatar-sm.webp
    logo-alt: "Aravind Hebbali"
    search: true
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: packages/index.qmd
        text: Packages
      - href: apps/index.qmd
        text: Apps
      - href: books/index.qmd
        text: Books
    right:
      - text: Teaching
        href: https://www.rsquaredacademy.com/
        target: _blank
      - icon: github
        href: https://github.com/aravindhebbali
        aria-label: GitHub
        target: _blank
      - text: Blog
        href: https://blog.rsquaredacademy.com
        target: _blank

  # `page-footer` is a `website:`-level option (indent 2), NOT a format.html
  # one and NOT nested inside navbar. Both mistakes are silent - the site just
  # renders with no footer at all. This is where the contact links live.
  page-footer:
    left: "© Aravind Hebbali · Bengaluru, India"
    right:
      - icon: envelope
        href: "mailto:hebbali.aravind@gmail.com"
        aria-label: Email
      - icon: github
        href: https://github.com/aravindhebbali
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/aravind-hebbali-b6553831/
        aria-label: LinkedIn
      - icon: rss
        href: https://blog.rsquaredacademy.com/
        aria-label: Blog
      - icon: link-45deg
        href: https://www.rsquaredacademy.com/
        aria-label: "Rsquared Academy"

format:
  html:
    theme:
      - cosmo
    css: styles.css
    toc: false
    anchor-sections: true
    smooth-scroll: true
    canonical-url: true
    link-external-icon: true
    link-external-newwindow: true
    include-in-header:
      - head-includes.html

# The homepage has no executable chunks. The CRAN download chunk was removed
# (see roadmap 8.7) so `quarto render` needs no R execution; post-render.R
# still uses R for sitemap/robots fixups.
execute:
  warning: false
  message: false